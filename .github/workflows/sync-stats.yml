
name: Sync stats.db

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure SSH verification
        shell: bash
        env:
          SFTP_KNOWN_HOST: ${{ secrets.SFTP_KNOWN_HOST }}
        run: |
          set -euo pipefail

          : "${SFTP_KNOWN_HOST:?Missing SFTP_KNOWN_HOST secret}"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SFTP_KNOWN_HOST" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -F "[na1980.pebblehost.net]:2222" \
            -f "$HOME/.ssh/known_hosts" > /dev/null || {
              echo "Missing PebbleHost entry in known_hosts"
              exit 1
            }

          echo "SSH known_hosts entry found"

      - name: Download stats.db via SFTP
        shell: bash
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set -euo pipefail

          : "${FTP_USER:?Missing FTP_USER secret}"
          : "${FTP_PASS:?Missing FTP_PASS secret}"

          echo "Connecting to PebbleHost via SFTP..."

          curl --fail --show-error --silent \
            --knownhosts "$HOME/.ssh/known_hosts" \
            --user "$FTP_USER:$FTP_PASS" \
            --output stats.db \
            "sftp://na1980.pebblehost.net:2222/~/config/minion/stats.db"

          test -s stats.db

          echo "stats.db downloaded successfully"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add stats.db

          if git diff --staged --quiet; then
            echo "No changes to stats.db"
          else
            git commit -m "auto update stats"
            git push origin HEAD:main
          fi
