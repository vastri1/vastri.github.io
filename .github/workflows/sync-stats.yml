name: Sync stats.db

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify FTP configuration
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail

          test -n "$FTP_USER" || {
            echo "::error::FTP_USER secret is missing"
            exit 1
          }

          test -n "$FTP_PASS" || {
            echo "::error::FTP_PASS secret is missing"
            exit 1
          }

          test -n "$FTP_HOST" || {
            echo "::error::FTP_HOST secret is missing"
            exit 1
          }

          test -n "$FTP_PORT" || {
            echo "::error::FTP_PORT secret is missing"
            exit 1
          }

          echo "FTP configuration is present."

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download stats.db from Apex
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail

          echo "Downloading stats.db using explicit FTP over TLS..."

          lftp \
            -u "$FTP_USER","$FTP_PASS" \
            -p "$FTP_PORT" \
            "$FTP_HOST" \
            -e "
              set ftp:ssl-force true;
              set ftp:ssl-auth TLS;
              set ftp:ssl-protect-data true;
              set ftp:ssl-protect-list true;
              set ftp:passive-mode true;
              set ftp:ssl-data-use-keys false;
              set ssl:verify-certificate true;
              set net:timeout 20;
              set net:max-retries 2;
              get /default/config/minion/stats.db -o stats.db;
              bye;
            "

          if [ ! -s stats.db ]; then
            echo "::error::stats.db was not downloaded or is empty"
            exit 1
          fi

          echo "stats.db downloaded successfully."
          ls -lh stats.db

      - name: Commit and push stats.db
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add stats.db

          if git diff --staged --quiet; then
            echo "stats.db has not changed. Nothing to commit."
            exit 0
          fi

          git commit -m "auto update stats"
          git push
