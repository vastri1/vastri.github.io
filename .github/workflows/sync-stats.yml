
name: Sync stats.db

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Configure SSH host verification
        shell: bash
        env:
          SFTP_KNOWN_HOST: ${{ secrets.SFTP_KNOWN_HOST }}
        run: |
          set -euo pipefail

          : "${SFTP_KNOWN_HOST:?Missing SFTP_KNOWN_HOST secret}"

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SFTP_KNOWN_HOST" > "$HOME/.ssh/known_hosts"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Download stats.db via SFTP
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
        run: |
          set -euo pipefail

          : "${SFTP_HOST:?Missing SFTP_HOST secret}"
          : "${SFTP_PORT:?Missing SFTP_PORT secret}"
          : "${SFTP_USER:?Missing SFTP_USER secret}"
          : "${SFTP_PASS:?Missing SFTP_PASS secret}"

          curl --fail --show-error \
            --user "$SFTP_USER:$SFTP_PASS" \
            "sftp://${SFTP_HOST}:${SFTP_PORT}/default/config/minion/stats.db" \
            --output stats.db

          test -s stats.db
          echo "stats.db downloaded successfully"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add stats.db

          if git diff --staged --quiet; then
            echo "No changes to stats.db"
          else
            git commit -m "auto update stats"
            git push origin HEAD:main
          fi
