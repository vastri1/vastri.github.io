name: Sync stats.db

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Verify SFTP configuration
        env:
          SFTP_USER: ${{ secrets.FTP_USER }}
          SFTP_PASS: ${{ secrets.FTP_PASS }}
          SFTP_HOST: ${{ secrets.FTP_HOST }}
          SFTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail

          test -n "$SFTP_USER" || { echo "::error::FTP_USER is missing"; exit 1; }
          test -n "$SFTP_PASS" || { echo "::error::FTP_PASS is missing"; exit 1; }
          test -n "$SFTP_HOST" || { echo "::error::FTP_HOST is missing"; exit 1; }
          test -n "$SFTP_PORT" || { echo "::error::FTP_PORT is missing"; exit 1; }

      - name: Install SFTP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Trust SFTP host
        env:
          SFTP_HOST: ${{ secrets.FTP_HOST }}
          SFTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SFTP_PORT" "$SFTP_HOST" >> ~/.ssh/known_hosts

      - name: Download stats.db via SFTP
        env:
          SFTP_USER: ${{ secrets.FTP_USER }}
          SFTP_PASS: ${{ secrets.FTP_PASS }}
          SFTP_HOST: ${{ secrets.FTP_HOST }}
          SFTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          sshpass -p "$SFTP_PASS" sftp \
            -P "$SFTP_PORT" \
            "$SFTP_USER@$SFTP_HOST" <<EOF
          get /default/config/minion/stats.db stats.db
          bye
          EOF

          test -s stats.db || {
            echo "::error::stats.db is missing or empty"
            exit 1
          }

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add stats.db

          if git diff --staged --quiet; then
            echo "stats.db has not changed."
            exit 0
          fi

          git commit -m "auto update stats"
          git push
